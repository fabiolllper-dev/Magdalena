<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magdalena Match-3 — Miami</title>
<style>
:root{--purple:#261044;--purple2:#3d1769;--gold:#ffd43b;--cream:#fff4df;--pink:#ff4c91;--ink:#28153c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:white;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 20% 0,#70429b 0,transparent 38%),linear-gradient(145deg,#160927,#321052 60%,#4c175f)}
button{font:inherit;font-weight:850;border:0;cursor:pointer;touch-action:manipulation;transition:transform .12s,filter .12s}button:hover{filter:brightness(1.08)}button:active{transform:scale(.97)}.wrap{max-width:1500px;margin:auto;padding:clamp(10px,1.8vw,24px)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:1000;font-size:clamp(1.35rem,4vw,2.2rem);letter-spacing:-.04em;text-shadow:0 3px 0 #12051e}.brand span{color:var(--gold)}.pill{border:2px solid #ffffff35;background:#ffffff12;border-radius:999px;padding:9px 14px;font-weight:800}.panel{background:#fffaf0;color:var(--ink);border:4px solid var(--gold);border-radius:26px;box-shadow:0 14px 0 #13062180,0 20px 45px #0004;padding:clamp(16px,3vw,26px);margin-top:18px}.hero{text-align:center}.hero h1{font-size:clamp(2rem,7vw,4.5rem);line-height:.98;margin:6px 0 12px;color:#4c1a75}.hero p{font-size:1.05rem;font-weight:650}.btn{min-height:58px;padding:13px 24px;border-radius:17px;background:linear-gradient(#ffe96a,#ffbf25);color:#35134e;box-shadow:0 5px 0 #b97a09;font-size:1.05rem}.btn.secondary{background:linear-gradient(#ff8fc1,#ff4d93);color:white;box-shadow:0 5px 0 #a91f62}.btn.dark{background:linear-gradient(#7644a4,#512179);color:white;box-shadow:0 5px 0 #2b0e42}.levelgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin-top:18px}.levelbtn{min-height:100px;border:3px solid #f5ca49;border-radius:18px;background:linear-gradient(145deg,#fff,#ffe6bd);color:#381852;padding:12px}.levelbtn b{display:block;font-size:1.2rem}.levelbtn small{display:block;margin-top:5px;font-weight:700}.game-layout{display:grid;grid-template-columns:minmax(0,1fr) 205px;gap:14px;align-items:start}.game-layout .board-wrap{width:100%;max-width:none}.game-layout .board{width:100%;aspect-ratio:1;gap:clamp(3px,.45vw,7px)}.board-wrap{position:relative;overflow:visible;background:linear-gradient(145deg,#371257,#1b0b2e);padding:10px;border:4px solid #ffd43b;border-radius:22px;box-shadow:inset 0 0 0 2px #ffffff25}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;aspect-ratio:1}.cell{display:grid;place-items:center;min-width:0;aspect-ratio:1;border-radius:10px;background:#ffffff12;border:1px solid #ffffff18;padding:1px;user-select:none}.cell.blocked{background:repeating-linear-gradient(135deg,#1b0b2d,#1b0b2d 7px,#28123d 7px,#28123d 14px);opacity:.65}.tile{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 2px #0006);cursor:pointer}.cell.selected{outline:4px solid #fff36b;outline-offset:-3px;background:#ffe66d35}.side{display:grid;gap:12px}.stat{background:#fff5df;border:3px solid #f5ca49;color:#32144c;border-radius:18px;padding:13px;text-align:center}.stat small{font-weight:800;display:block;text-transform:uppercase;letter-spacing:.06em}.stat strong{font-size:1.7rem}.hint{color:#5e4a6d;font-size:.9rem;line-height:1.4;font-weight:650}.message{font-weight:800;color:#522179;min-height:26px}.overlay{position:fixed;inset:0;z-index:10;background:#080313eF;display:flex;align-items:center;justify-content:center;padding:14px}.ad-card{width:min(650px,100%);max-height:96vh;overflow:auto;text-align:center;background:linear-gradient(145deg,#211047,#48206f);border:5px solid #ffd43b;border-radius:28px;padding:16px;box-shadow:0 0 0 5px #ffcc3340,0 18px 60px #0009}.ad-card h2{font-size:clamp(1.2rem,4vw,1.7rem);color:#ffe66d;margin:4px}.ad-card .slogan{font-size:clamp(1.9rem,7vw,3rem);font-weight:1000;line-height:1.03;margin:7px 0 14px;text-shadow:0 3px 0 #12051e}.ad-photo{display:block;max-width:100%;height:min(54vh,530px);object-fit:contain;margin:auto;border:5px solid #ffcf37;border-radius:18px;background:#fff4cf;padding:5px}.ad-bottom{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}.ad-count{color:#ffe66d;font-size:.88rem;font-weight:850}.particle-layer{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:5}.particle{position:absolute;width:8px;height:8px;border-radius:2px;pointer-events:none;will-change:transform,opacity;animation:particleFly .62s cubic-bezier(.12,.65,.35,1) forwards;box-shadow:0 0 5px #fff8}@keyframes particleFly{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.15);opacity:0}}.lightning-bolt{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:9;overflow:visible;animation:boltFlash .58s ease-out forwards;filter:drop-shadow(0 0 7px #7df7ff) drop-shadow(0 0 15px #fff)}.lightning-bolt path{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.lightning-bolt .glow{stroke:#42dcff;stroke-width:17;opacity:.8}.lightning-bolt .branch{stroke:#fff6a8;stroke-width:4}@keyframes boltFlash{0%{opacity:0}8%,28%{opacity:1}40%{opacity:.25}55%{opacity:1}100%{opacity:0}}
.hidden{display:none!important}.modal-title{font-size:clamp(1.7rem,5vw,2.5rem);color:#4c1a75;margin:0}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.footer{text-align:center;color:#d6c6e7;font-size:.8rem;padding:20px}
@media(min-width:1100px){#game .board-wrap{padding:14px}.cell{border-radius:12px}}
@media(max-width:700px){.wrap{padding:8px}.game-layout{grid-template-columns:1fr}.side{grid-template-columns:repeat(3,minmax(0,1fr));order:-1}.stat{padding:8px 4px}.stat strong{font-size:1.25rem}.stat small{font-size:.68rem}.board-wrap{padding:6px;border-width:3px}.board{gap:3px}.cell{border-radius:7px}.hint{grid-column:1/-1;text-align:center}.game-actions{display:flex;gap:8px}.game-actions button{flex:1;min-height:52px;padding:10px 8px}.panel{margin-top:12px}}

/* Animaciones añadidas */
@keyframes tileAppear{0%{opacity:1;transform:scale(.94) translateY(-5px)}70%{opacity:1;transform:scale(1.025) translateY(1px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes boardIntro{0%{opacity:0;transform:translateY(18px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes selectedPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
@keyframes buttonPop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes matchBurst{0%{transform:scale(1);filter:brightness(1)}45%{transform:scale(1.16);filter:brightness(1.65)}100%{transform:scale(.94);opacity:1;filter:brightness(1.2)}}
@keyframes modalIn{0%{opacity:0;transform:translateY(24px) scale(.92)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 #ffd43b00}50%{box-shadow:0 0 24px #ffd43b99}}
.board-wrap{animation:boardIntro .55s cubic-bezier(.2,.8,.2,1) both}
.tile{animation:tileAppear .38s cubic-bezier(.2,.8,.2,1) both;transition:transform .16s ease,filter .16s ease}
.cell:not(.blocked):hover .tile{transform:scale(1.09) rotate(-3deg);filter:drop-shadow(0 5px 5px #0008) brightness(1.1)}
.cell.selected .tile{animation:selectedPulse .7s ease-in-out infinite}
.btn,.levelbtn{transition:transform .18s ease,filter .18s ease,box-shadow .18s ease}
.btn:hover,.levelbtn:hover{transform:translateY(-3px)}
.btn:active,.levelbtn:active{transform:scale(.96)}
.panel.hero{animation:modalIn .45s cubic-bezier(.2,.8,.2,1) both}
.stat{transition:transform .2s ease,box-shadow .2s ease}
.stat:active{transform:scale(.97)}
.overlay:not(.hidden)>.panel{animation:modalIn .35s ease both}
#resultOverlay:not(.hidden) .panel{animation:modalIn .42s cubic-bezier(.2,.8,.2,1) both;animation-delay:.04s}
.message{transition:color .2s ease}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}


/* Arrastrar dientes: gesto táctil y ratón */
.board{touch-action:none; user-select:none;-webkit-user-select:none}
.cell{touch-action:none;transition:transform .12s,background .12s}
.cell.drag-origin{transform:scale(.94);background:#ffe66d55;z-index:2}
.cell.drag-origin .tile{opacity:.28}
.drag-ghost{position:fixed;z-index:9999;pointer-events:none;object-fit:contain;filter:drop-shadow(0 9px 7px #0009) drop-shadow(0 0 7px #ffe66d);transform:translate(-50%,-65%) scale(1.22) rotate(-5deg);will-change:left,top;width:64px;height:64px;transition:filter .1s;animation:grabPop .12s ease-out}
@keyframes grabPop{from{transform:translate(-50%,-65%) scale(.8) rotate(0)}to{transform:translate(-50%,-65%) scale(1.22) rotate(-5deg)}}
.cell.drag-target{outline:3px dashed #ffe66d;outline-offset:-4px}
.tile{pointer-events:none;transition:transform .16s ease,filter .16s ease}
@media(prefers-reduced-motion:reduce){.cell,.tile{transition:none}}

.collectible-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:22px 0 8px;text-align:left}.comb-card,.podium-card{border:3px solid #f0c64b;border-radius:20px;background:linear-gradient(145deg,#fff8df,#ffe3ad);padding:14px;color:#3b1b50;box-shadow:0 5px 0 #c78a24}.comb-card{display:flex;align-items:center;gap:13px}.comb-icon{width:58px;height:58px;display:grid;place-items:center;background:#fff;border-radius:15px;border:2px solid #f6d76a;font-size:2rem}.comb-card b,.podium-title{display:block;font-weight:1000}.comb-card small,.podium-card small{display:block;font-weight:750;margin-top:4px}.podium-card{text-align:center}.podium-title{font-size:.92rem}.podium-stage{height:100px;width:150px;max-width:100%;margin:8px auto 6px;position:relative;display:flex;justify-content:center;align-items:flex-end;border-bottom:12px solid #b67b18;border-radius:8px;background:linear-gradient(#fff4d9,#f5cb72)}.podium-stage:before{content:"";position:absolute;bottom:-12px;left:15px;width:120px;height:24px;background:linear-gradient(#e9ae35,#b87512);clip-path:polygon(12% 0,88% 0,100% 100%,0 100%)}.podium-empty{width:58px;height:58px;display:grid;place-items:center;margin-bottom:12px;border:3px dashed #b68a42;border-radius:50%;font-size:1.8rem;color:#b68a42;background:#fff8e5}.podium-head{width:82px;height:82px;object-fit:contain;position:relative;z-index:1;margin-bottom:5px;filter:drop-shadow(0 4px 2px #5b351b55);animation:podiumPop .45s cubic-bezier(.2,.9,.3,1.3)}@keyframes podiumPop{from{transform:translateY(20px) scale(.5);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}.particle-layer{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:5}.particle{position:absolute;width:8px;height:8px;border-radius:2px;pointer-events:none;will-change:transform,opacity;animation:particleFly .62s cubic-bezier(.12,.65,.35,1) forwards;box-shadow:0 0 5px #fff8}@keyframes particleFly{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.15);opacity:0}}.hidden{display:none!important}


/* Magdalena: ficha especial + explosión */
.tile.mag{filter:drop-shadow(0 0 7px #ffd43bcc) drop-shadow(0 3px 2px #0006);animation:tileAppear .38s cubic-bezier(.2,.8,.2,1) both,magGlow 1.9s ease-in-out .5s infinite}
@keyframes magGlow{0%,100%{filter:drop-shadow(0 0 4px #ffd43b99) drop-shadow(0 3px 2px #0006)}50%{filter:drop-shadow(0 0 13px #ffe66d) drop-shadow(0 3px 2px #0006)}}
@keyframes magBoom{0%{transform:scale(1) rotate(0);opacity:1;filter:brightness(1)}35%{transform:scale(1.55) rotate(-9deg);filter:brightness(2) drop-shadow(0 0 20px #ffd43b)}100%{transform:scale(.15) rotate(14deg);opacity:0;filter:brightness(3)}}
.particle.star{width:14px;height:14px;border-radius:0;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%);box-shadow:none}
.shock{position:absolute;transform:translate(-50%,-50%) scale(.3);border-radius:50%;border:5px solid #ffe66d;box-shadow:0 0 22px #ffd43b,inset 0 0 18px #ffd43b88;pointer-events:none;opacity:0;animation:shockRing .62s ease-out forwards}
@keyframes shockRing{0%{opacity:.95;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.4)}}
.mag-flash{position:absolute;inset:-4px;border-radius:20px;background:radial-gradient(circle,#fff6b8aa,#ffd43b33 55%,transparent 75%);pointer-events:none;animation:magFlash .5s ease-out forwards}
@keyframes magFlash{0%{opacity:1}100%{opacity:0}}
.board-wrap.shake{animation:boardShake .42s cubic-bezier(.36,.07,.19,.97) both}
@keyframes boardShake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,3px)}40%,60%{transform:translate(6px,-3px)}100%{transform:translate(0,0)}}
.bonus-tag{position:absolute;transform:translate(-50%,-50%);font-weight:1000;font-size:clamp(1.1rem,3.4vw,1.7rem);color:#ffe66d;text-shadow:0 2px 0 #7a4a00,0 0 12px #ffb300;pointer-events:none;white-space:nowrap;animation:bonusUp .95s ease-out forwards;z-index:7}
@keyframes bonusUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-70%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.score-pop{position:absolute;transform:translate(-50%,-50%);font-weight:1000;font-size:clamp(1.2rem,3.6vw,1.9rem);color:#fff;text-shadow:0 2px 0 #4c1a75,0 0 10px #ff4c91;text-align:center;pointer-events:none;white-space:nowrap;animation:popUp 1.05s ease-out forwards;z-index:8;line-height:1.05}
.score-pop small{display:block;font-size:.55em;color:#7df0ff;text-shadow:0 1px 0 #1b0b2e,0 0 8px #00b4ff}
.score-pop small.gold{color:#fff2a8;text-shadow:0 1px 0 #7a4a00,0 0 8px #ffb300}
.score-pop.mag{color:#ffe66d;text-shadow:0 2px 0 #7a4a00,0 0 14px #ffb300;font-size:clamp(1.5rem,4.6vw,2.4rem)}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}18%{opacity:1;transform:translate(-50%,-60%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-180%) scale(1)}}
.cell.hint-glow{animation:hintPulse .8s ease-in-out infinite;background:#7df0ff33;outline:3px solid #7df0ffcc;outline-offset:-3px}
@keyframes hintPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.message{color:#ffe66d!important;text-shadow:0 1px 0 #12051e}
#resultDetails{white-space:pre-line;font-size:1.15rem}
@media(prefers-reduced-motion:reduce){.board-wrap.shake{animation:none}.tile.mag{animation:none}}

/* Ajuste móvil: tablero compacto, centrado y sin desbordarse */
@media(max-width:700px){
  body{min-width:0;overflow-x:hidden}
  .wrap{width:100%;max-width:100%;padding:6px}
  .top{gap:6px;justify-content:center}
  .brand{width:100%;text-align:center;font-size:clamp(1.15rem,5vw,1.55rem);line-height:1.1}
  .top>div:last-child{justify-content:center;gap:5px!important}
  .pill{font-size:.72rem;padding:6px 9px;border-width:1px}
  #game.panel{padding:9px;margin-top:8px;border-width:3px;border-radius:17px}
  .game-layout{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
  .game-layout>.board-wrap{width:min(100%, calc(100vw - 30px), 43vh);max-width:100%;padding:5px;border-width:3px;border-radius:15px;margin-inline:auto}
  .game-layout .board{width:100%;height:auto;aspect-ratio:1;gap:2px}
  .cell{border-radius:5px;padding:0}
  .side{width:100%;grid-template-columns:repeat(3,minmax(0,1fr));order:-1;gap:5px}
  .stat{padding:5px 2px;border-width:2px;border-radius:10px}
  .stat strong{font-size:1.05rem;line-height:1.1}
  .stat small{font-size:.58rem;letter-spacing:0}
  .hint{font-size:.76rem;line-height:1.25;margin:2px 0}
  .message{font-size:.8rem;min-height:18px}
  .game-actions{gap:6px}
  .game-actions button{min-height:42px;padding:7px 5px;font-size:.85rem;border-radius:12px}
  .panel{padding:12px;border-radius:18px}
  .footer{padding:10px 4px;font-size:.7rem}
}
@media(max-width:380px){
  .game-layout>.board-wrap{width:min(100%, calc(100vw - 24px), 40vh)}
  .pill{font-size:.67rem;padding:5px 7px}
  .stat small{font-size:.53rem}
}
@media(max-height:650px) and (max-width:900px){
  .game-layout>.board-wrap{width:min(100%, calc(100vw - 24px), 58vh)}
  .wrap{padding:4px}
  #game.panel{padding:6px;margin-top:5px}
  .game-layout{gap:5px}
}


/* Texto de impacto al combinar tres o más Magdalenas */
.mag-shout{position:absolute;left:50%;top:42%;z-index:20;pointer-events:none;white-space:nowrap;font-family:Impact,Haettenschweiler,'Arial Black',sans-serif;font-size:clamp(25px,7vw,62px);font-weight:1000;letter-spacing:1.5px;color:#fff8a6;-webkit-text-stroke:1.5px #7c1aab;text-shadow:0 3px 0 #ff4c91,0 6px 0 #7c1aab,0 0 12px #fff,0 0 26px #ffd43b;transform:translate(-50%,-50%) scale(.1) rotate(-8deg);animation:magShout .95s cubic-bezier(.16,1.4,.35,1) forwards}
.mag-shout span{display:block;font-size:.35em;letter-spacing:3px;color:white;-webkit-text-stroke:.5px #8a248e;text-align:center;margin-top:-2px}
@keyframes magShout{0%{opacity:0;transform:translate(-50%,-50%) scale(.1) rotate(-12deg)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(4deg)}38%{transform:translate(-50%,-50%) scale(.94) rotate(-2deg)}52%{transform:translate(-50%,-50%) scale(1.04) rotate(1deg)}78%{opacity:1;transform:translate(-50%,-58%) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-85%) scale(.82) rotate(0)}}

</style>
</head>
<body>
<div class="wrap">
 <header class="top"><div class="brand">MAGDALENA <span>MATCH-3</span> 🍬</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><div class="pill">🌴 MIAMI EDITION</div><button id="fullscreenToggle" class="pill" type="button" title="Pantalla completa" aria-pressed="false">⛶ Pantalla completa</button><button id="langToggle" class="pill" type="button" title="Language / Idioma">🌐 ES</button><button id="soundToggle" class="pill" type="button" aria-pressed="true" data-i18n-title="soundTitle"></button><button id="musicToggle" class="pill" type="button" aria-pressed="false" data-i18n-title="musicTitle"></button></div></header>
 <section id="home" class="panel hero">
  <div style="font-weight:900;color:#d14b84;letter-spacing:.12em" data-i18n="ready"></div>
  <h1 data-i18n-html="heroTitle"></h1>
  <p data-i18n-html="heroDesc"></p>
  <button class="btn" id="playBtn" data-i18n="play"></button>
  <div class="collectible-row"><div class="comb-card"><span class="comb-icon" id="combIcon"></span><div><b data-i18n="combTitle"></b><small id="combProgress"></small></div></div><div class="podium-card"><div class="podium-title" data-i18n="podiumTitle"></div><div class="podium-stage"><div class="podium-empty" id="podiumEmpty">?</div><img id="podiumHead" class="podium-head hidden" alt="" data-i18n-alt="headAlt" /></div><small id="podiumStatus"></small></div></div>
  <h2 style="margin:25px 0 8px;color:#4c1a75" data-i18n="chooseLevel"></h2>
  <div class="levelgrid" id="levelGrid"></div>
 </section>
 <section id="game" class="hidden">
  <div class="top" style="margin:14px 0"><div><div class="pill" id="levelLabel"></div></div><button class="btn dark" id="mapBtn" data-i18n="menuLevels"></button></div>
  <div class="game-layout">
   <div class="board-wrap"><div class="board" id="board" data-i18n-aria="boardAria"></div><div class="particle-layer" id="particleLayer" aria-hidden="true"></div></div>
   <aside class="side">
    <div class="stat"><small data-i18n="score"></small><strong id="score">0</strong></div>
    <div class="stat"><small data-i18n="moves"></small><strong id="moves">16</strong></div>
    <div class="stat"><small data-i18n="target"></small><strong id="target">1450</strong></div>
    <div class="stat" id="collectStat"><small data-i18n="collectDefault"></small><strong id="collect">—</strong></div>
    <div class="hint" id="hint" data-i18n="hintDefault"></div>
    <div class="message" id="message" aria-live="polite"></div>
    <div class="game-actions"><button class="btn dark" id="restartBtn" data-i18n="restart"></button><button class="btn secondary" id="shuffleBtn" data-i18n="shuffle"></button></div>
   </aside>
  </div>
 </section>
 <div class="footer" data-i18n="footer"></div>
</div>
<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
 <div class="ad-card" id="adCard">
  <div style="font-weight:1000;letter-spacing:.18em;color:#ffe66d" data-i18n="adTag"></div>
  <div class="slogan" data-i18n="adSlogan"></div>
  <img class="ad-photo" id="adPhoto" alt="" data-i18n-alt="adAlt">
  <div class="ad-bottom"><button class="btn" id="skipAd" data-i18n="skipAd"></button><div class="ad-count" id="adCount"></div></div>
 </div>
</div>
<div id="resultOverlay" class="overlay hidden">

function findMatches(){let set=new Set();for(let y=0;y<size;y++){let x=0;while(x<size){let t=grid[y][x],end=x+1;if(!t||blocked(x,y)){x++;continue}while(end<size&&!blocked(end,y)&&grid[y][end]===t)end++;if(end-x>=3)for(let k=x;k<end;k++)set.add(y*size+k);x=end}}
for(let x=0;x<size;x++){let y=0;while(y<size){let t=grid[y][x],end=y+1;if(!t||blocked(x,y)){y++;continue}while(end<size&&!blocked(x,end)&&grid[end][x]===t)end++;if(end-y>=3)for(let k=y;k<end;k++)set.add(k*size+x);y=end}}return [...set]}
function render(){const board=$("board");board.innerHTML="";for(let y=0;y<size;y++)for(let x=0;x<size;x++){let c=document.createElement("button");c.className="cell"+(blocked(x,y)?" blocked":"")+(selected&&selected.x===x&&selected.y===y?" selected":"");c.setAttribute("aria-label",blocked(x,y)?t('blockedCell'):`${t('piece')} ${grid[y][x]===6?"Magdalena":(labelOf(COLORS[grid[y][x]-1])||"")}`);if(!blocked(x,y)){let im=document.createElement("img");im.className="tile"+(grid[y][x]===6?" mag":"");im.draggable=false;im.src=makeImg(grid[y][x]);im.alt="";im.style.animationDelay=((x*31+y*17)%130)+"ms";c.dataset.x=x;c.dataset.y=y;c.appendChild(im);c.addEventListener("click",()=>{if(Date.now()<(window.dragHandledUntil||0))return;pick(x,y)});}board.appendChild(c)}$("score").textContent=score;$("moves").textContent=moves;$("target").textContent=LEVELS[levelIndex].target;$("levelLabel").textContent=`${t('level')} ${levelIndex+1} · ${LEVELS[levelIndex].name.toUpperCase()}`;const cfg=LEVELS[levelIndex];$("collectStat").classList.toggle("hidden",cfg.collect<0);$("collectStat").querySelector("small").textContent=cfg.collect<0?t('extraGoal'):collectLabel(cfg.collect);$("collect").textContent=cfg.collect<0?"—":`${collected}/${cfg.collectTarget}`;$("hint").textContent=cfg.collect<0?t('goalOnly',{target:cfg.target}):t('goalFull',{target:cfg.target,n:cfg.collectTarget,what:collectWhat(cfg.collect),pts:MAG_POINTS});}
// Permite intercambiar dientes arrastrando con ratón o dedo.
let dragStart=null, dragMoved=false;
const dragBoard=$("board");
let dragGhost=null;
function clearDragVisual(){if(dragGhost){dragGhost.remove();dragGhost=null}dragBoard.querySelectorAll(".drag-origin,.drag-target").forEach(c=>c.classList.remove("drag-origin","drag-target"));}
dragBoard.addEventListener("pointerdown",e=>{const cell=e.target.closest(".cell:not(.blocked)");if(!cell||busy)return;const tile=cell.querySelector(".tile");if(!tile)return;dragStart={x:+cell.dataset.x,y:+cell.dataset.y,cell,pointerId:e.pointerId};dragMoved=false;sfx("grab");cell.classList.add("drag-origin");dragGhost=tile.cloneNode(true);dragGhost.className="drag-ghost";dragGhost.style.width=Math.max(44,cell.getBoundingClientRect().width*1.18)+"px";dragGhost.style.height=dragGhost.style.width;dragGhost.style.left=e.clientX+"px";dragGhost.style.top=e.clientY+"px";document.body.appendChild(dragGhost);try{dragBoard.setPointerCapture(e.pointerId)}catch(_){};});
dragBoard.addEventListener("pointermove",e=>{if(!dragStart||e.pointerId!==dragStart.pointerId)return;if(dragGhost){dragGhost.style.left=e.clientX+"px";dragGhost.style.top=e.clientY+"px"}const el=document.elementFromPoint(e.clientX,e.clientY)?.closest(".cell");dragBoard.querySelectorAll(".drag-target").forEach(c=>c.classList.remove("drag-target"));if(el&&!el.classList.contains("blocked")){el.classList.add("drag-target");if(el!==dragStart.cell)dragMoved=true}});
function finishDrag(e){if(!dragStart)return;const start=dragStart;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest(".cell:not(.blocked)");clearDragVisual();dragStart=null;if(target&&target!==start.cell&&Math.abs(+target.dataset.x-start.x)+Math.abs(+target.dataset.y-start.y)===1){window.dragHandledUntil=Date.now()+450;selected={x:start.x,y:start.y};pick(+target.dataset.x,+target.dataset.y);window.dragHandledUntil=Date.now()+450;}else if(dragMoved){window.dragHandledUntil=Date.now()+250;}}
dragBoard.addEventListener("pointerup",finishDrag);dragBoard.addEventListener("pointercancel",()=>{clearDragVisual();dragStart=null});
function pick(x,y){if(busy)return;if(!selected){selected={x,y};sfx("select");render();return}if(selected.x===x&&selected.y===y){selected=null;render();return}if(Math.abs(selected.x-x)+Math.abs(selected.y-y)!==1){selected={x,y};sfx("select");render();return}const a=selected;selected=null;[grid[a.y][a.x],grid[y][x]]=[grid[y][x],grid[a.y][a.x]];const matches=findMatches();if(!matches.length){sfx("invalid");[grid[a.y][a.x],grid[y][x]]=[grid[y][x],grid[a.y][a.x]];$("message").textContent=t('noMatch');render();return}sfx("swap");moves--;turnGain=0;turnMag=0;resolveMatches(matches,1)}
const MAG_POINTS=200;
let turnGain=0,turnMag=0;
function cellCenter(i){const layer=$("particleLayer"),cell=$("board").children[i];if(!layer||!cell)return null;const w=layer.getBoundingClientRect(),r=cell.getBoundingClientRect();return{x:r.left+r.width/2-w.left,y:r.top+r.height/2-w.top,w:r.width}}
function scorePopup(indices,gained,combo,isMag){
 const layer=$("particleLayer");if(!layer||!indices.length)return;
 let sx=0,sy=0,n=0;for(const i of indices){const c=cellCenter(i);if(c){sx+=c.x;sy+=c.y;n++}}if(!n)return;
 const p=document.createElement("div");p.className="score-pop"+(isMag?" mag":"")+(combo>1?" combo":"");
 p.innerHTML=`+${gained}`+(isMag?`<small class="gold">${t('magPop')}</small>`:"")+(combo>1?`<small>${t('combo').toUpperCase()} x${combo}</small>`:"");
 p.style.left=(sx/n)+"px";p.style.top=(sy/n)+"px";layer.appendChild(p);p.addEventListener("animationend",()=>p.remove(),{once:true});
}
function lightningStrike(indices){
 const layer=$("particleLayer"),wrap=$("board").parentElement;if(!layer||indices.length<3)return;
 const pts=indices.map(i=>cellCenter(i)).filter(Boolean);if(pts.length<3)return;
 const w=layer.clientWidth,h=layer.clientHeight,avgX=pts.reduce((a,p)=>a+p.x,0)/pts.length;
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('preserveAspectRatio','none');svg.classList.add('lightning-bolt');
 const pathFor=(end,j)=>{let x=avgX+(j-1)*Math.min(35,w*.045),y=0,d=`M ${x} ${y}`;const steps=5;for(let k=1;k<steps;k++){x+=(end.x-x)*(1/ (steps-k+1))+(Math.random()-.5)*Math.min(42,w*.05);y=end.y*k/steps;d+=` L ${x} ${y}`}d+=` L ${end.x} ${end.y}`;return d};
 pts.slice(0,Math.min(5,pts.length)).forEach((p,j)=>{const d=pathFor(p,j);for(const cls of ['glow','core']){const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',d);if(cls==='glow')path.classList.add('glow');svg.appendChild(path)}});
 layer.appendChild(svg);svg.addEventListener('animationend',()=>svg.remove(),{once:true});wrap.classList.remove('shake');void wrap.offsetWidth;wrap.classList.add('shake');sfx('lightning');
}
function magExplosion(indices){
 const layer=$("particleLayer"),wrap=$("board").parentElement;if(!layer)return;
 wrap.classList.remove("shake");void wrap.offsetWidth;wrap.classList.add("shake");
 const flash=document.createElement("div");flash.className="mag-flash";layer.appendChild(flash);flash.addEventListener("animationend",()=>flash.remove(),{once:true});
 const palette=["#ffd43b","#fff2a8","#ffb300","#ffffff","#ff7ac0","#ffe66d"];
 for(const i of indices){const c=cellCenter(i);if(!c)continue;
  for(let k=0;k<2;k++){const ring=document.createElement("div");ring.className="shock";ring.style.left=c.x+"px";ring.style.top=c.y+"px";ring.style.width=ring.style.height=(c.w*(k?1.4:.9))+"px";ring.style.animationDelay=(k*.09)+"s";layer.appendChild(ring);ring.addEventListener("animationend",()=>ring.remove(),{once:true})}
  for(let n=0;n<26;n++){const p=document.createElement("i");p.className="particle star";const a=Math.random()*Math.PI*2,d=45+Math.random()*95;p.style.left=(c.x-7)+"px";p.style.top=(c.y-7)+"px";p.style.background=palette[n%palette.length];p.style.setProperty("--dx",Math.cos(a)*d+"px");p.style.setProperty("--dy",Math.sin(a)*d+"px");p.style.setProperty("--rot",(Math.random()*720-360)+"deg");p.style.animationDuration=(.7+Math.random()*.4)+"s";layer.appendChild(p);p.addEventListener("animationend",()=>p.remove(),{once:true})}
 }
}
function burstParticles(indices){
 const layer=$("particleLayer"), board=$("board"); if(!layer||!board)return;
 const wrap=layer.getBoundingClientRect(); const palette=["#ffe66d","#ff4c91","#65e8ff","#a7ff83","#ffffff","#ffad42"];
 for(const idx of indices){const cell=board.children[idx];if(!cell)continue;const r=cell.getBoundingClientRect();const cx=r.left+r.width/2-wrap.left,cy=r.top+r.height/2-wrap.top;
  for(let n=0;n<7;n++){const p=document.createElement("i");p.className="particle";p.style.left=(cx-4+(Math.random()*8-4))+"px";p.style.top=(cy-4+(Math.random()*8-4))+"px";p.style.background=palette[Math.floor(Math.random()*palette.length)];p.style.setProperty("--dx",(Math.random()*90-45)+"px");p.style.setProperty("--dy",(Math.random()*-85-8)+"px");p.style.setProperty("--rot",(Math.random()*540-270)+"deg");layer.appendChild(p);p.addEventListener("animationend",()=>p.remove(),{once:true});}
 }
}
// Voz subida por el usuario: se reproduce cuando se combinan 3+ fichas de Magdalena.
const magVoice=new Audio('1023(1).mp3');magVoice.preload='auto';magVoice.volume=1;
function playMagVoice(){try{magVoice.pause();magVoice.currentTime=0;const p=magVoice.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
function showMagShout(){const layer=$('particleLayer');if(!layer)return;const el=document.createElement('div');el.className='mag-shout';el.innerHTML='¡HAYAYAY!<span>¡MAGDALENA!</span>';layer.appendChild(el);el.addEventListener('animationend',()=>el.remove(),{once:true});}
async function resolveMatches(matches,combo=1){
 busy=true;
 const board=$("board"), cfg=LEVELS[levelIndex], count=matches.length;
 // Partículas visibles en cada pieza que se rompe.
 const magIdx=matches.filter(i=>grid[Math.floor(i/size)][i%size]===6);
 const normalCount=count-magIdx.length;
 const mult=1+.5*(combo-1);
 const gained=Math.round((normalCount*60+magIdx.length*MAG_POINTS+(magIdx.length>=4?250:0))*mult);
 turnGain+=gained;turnMag+=magIdx.length;
 burstParticles(matches);
 if(magIdx.length>=3){lightningStrike(magIdx);magExplosion(magIdx);showMagShout();sfx("boom")}else if(magIdx.length){magExplosion(magIdx);sfx("boom")}else sfx(count>=5?"cascade":"match");
 if(combo>1)sfx("combo");
 scorePopup(matches,gained,combo,magIdx.length>0);
 // Primero se ve claramente cómo se rompen las piezas combinadas.
 for(const i of matches){const tile=board.children[i]?.querySelector(".tile");if(tile)tile.style.animation=(grid[Math.floor(i/size)][i%size]===6?"magBoom .34s ease-out forwards":"matchBurst .22s ease-out forwards");}
 for(const i of matches){const y=Math.floor(i/size),x=i%size;if(grid[y][x]===cfg.collect)collected++;}
 score+=gained;$("score").textContent=score;
 await new Promise(resolve=>setTimeout(resolve,magIdx.length?340:210));
 // Guardar de qué fila viene cada diente superviviente para animar su caída.
 const origins=Array.from({length:size},()=>Array(size).fill(null));
 for(let x=0;x<size;x++){
   const ys=[];for(let y=size-1;y>=0;y--)if(!blocked(x,y))ys.push(y);
   const survivors=ys.filter(y=>!matches.includes(y*size+x)&&grid[y][x]>0).map(y=>({type:grid[y][x],fromY:y}));
   const needed=ys.length-survivors.length;
   // ys y survivors van de abajo hacia arriba: las piezas que sobreviven
   // conservan su orden y las nuevas aparecen por encima de ellas.
   const vals=survivors.slice();
   for(let i=0;i<needed;i++)vals.push({type:randomType(),fromY:-needed+i,fresh:true});
   ys.forEach((y,i)=>{const item=vals[i];grid[y][x]=item.type;origins[y][x]=item.fromY;});
 }
 selected=null;render();
 // FLIP: los dientes nuevos empiezan por encima del tablero y los existentes
 // parten de su posición anterior. Así se ve el desplazamiento, no un reemplazo instantáneo.
 const boardRect=board.getBoundingClientRect();
 for(let y=0;y<size;y++)for(let x=0;x<size;x++){
   if(blocked(x,y))continue;const tile=board.children[y*size+x]?.querySelector(".tile");if(!tile)continue;
   const fromY=origins[y][x];if(fromY===null||fromY===undefined)continue;
   const delta=(fromY-y)*(boardRect.height/size);
   if(Math.abs(delta)<1)continue;
   tile.animate([{transform:`translateY(${delta}px) scale(.98)`},{transform:"translateY(0) scale(1)"}],{duration:290+Math.min(100,Math.abs(delta)*4),easing:"cubic-bezier(.22,.75,.25,1)"});
 }
 sfx("drop");
 await new Promise(resolve=>setTimeout(resolve,340));
 const cascade=findMatches();
 if(cascade.length){await resolveMatches(cascade,combo+1);return;}
 busy=false;$("message").textContent=turnMag?`${t('magMsg',{pts:turnGain})}${combo>1?` · ${t('combo')} x${combo}`:""}`:`${t('goodMsg',{pts:turnGain})}${combo>1?` · ${t('combo')} x${combo}`:""}`;
 if(!hasAnyMove()){newBoard();$("message").textContent=t('reshuffled');render();}
 checkEnd();
}
function checkEnd(){const cfg=LEVELS[levelIndex];if(score>=cfg.target&&(cfg.collect<0||collected>=cfg.collectTarget)){busy=true;setTimeout(()=>showAd(),250);return}if(moves<=0){busy=true;showResult(false);}}
let adOpen=false;
function showAd(){
 if(adOpen)return;adOpen=true;clearInterval(adTimer);
 const overlay=$("overlay"), photo=$("adPhoto"), count=$("adCount");
 overlay.classList.remove("hidden");
 // Reproducir el audio proporcionado al mostrarse el anuncio.
 playMagVoice();photo.src=AD_DATA;photo.onerror=()=>{photo.style.display="none"};photo.onload=()=>{photo.style.display="block"};
 let remain=5;count.textContent=`${t('adCount',{n:remain})}`;
 adTimer=setInterval(()=>{remain--;if(remain<=0){closeAd();return}count.textContent=`${t('adCount',{n:remain})}`},1000);
}
function closeAd(){
 if(!adOpen)return;adOpen=false;clearInterval(adTimer);adTimer=null;$("overlay").classList.add("hidden");
 if(!LEVELS[levelIndex]._peinetaAwarded){awardPeineta();LEVELS[levelIndex]._peinetaAwarded=true;}
 showResult(true);
}
function showResult(won){if(won){const st=starsFor();if(st>(bestStars[levelIndex]||0)){bestStars[levelIndex]=st;try{localStorage.setItem("magdalenaStars",JSON.stringify(bestStars))}catch(e){}}}sfx(won?"win":"lose");$("resultOverlay").classList.remove("hidden");$("resultTitle").textContent=won?t('won'):t('lost');$("resultDetails").textContent=won?`${"⭐".repeat(starsFor())}${"☆".repeat(3-starsFor())}\n${t('scoreLine',{score,name:LEVELS[levelIndex].name})}`:t('lostLine',{score});$("nextBtn").classList.toggle("hidden",!won||levelIndex===LEVELS.length-1);busy=true}
function startLevel(i){levelIndex=i;score=0;moves=LEVELS[i].moves;collected=0;selected=null;busy=false;$("home").classList.add("hidden");$("game").classList.remove("hidden");$("resultOverlay").classList.add("hidden");newBoard();render();$("message").textContent=t('letsGo')}
function showHome(){$("game").classList.add("hidden");$("home").classList.remove("hidden");$("resultOverlay").classList.add("hidden");busy=false;renderLevels();renderCollectibles()}
function renderLevels(){renderCollectibles();const el=$("levelGrid");el.innerHTML="";LEVELS.forEach((l,i)=>{let b=document.createElement("button");b.className="levelbtn";b.innerHTML=`<b>${t('level')} ${i+1} ${bestStars[i]?"⭐".repeat(bestStars[i]):"☆☆☆"}</b><small>${l.name}</small><small>${l.target.toLocaleString(lang==='en'?'en-US':'es-DO')} ${t('pointsWord')}</small><small>${l.collect<0?t('noExtra'):`${t('collectVerb')} ${l.collectTarget} ${collectWhat(l.collect)}`}</small><small>${l.moves} ${t('movesWord')}</small>`;b.addEventListener("click",()=>startLevel(i));el.appendChild(b)})}
$("playBtn").addEventListener("click",()=>startLevel(0));$("mapBtn").addEventListener("click",showHome);$("restartBtn").addEventListener("click",()=>startLevel(levelIndex));$("shuffleBtn").addEventListener("click",()=>{if(busy)return;sfx("shuffle");newBoard();selected=null;render();$("message").textContent=t('shuffled')});$("skipAd").addEventListener("click",closeAd);$("nextBtn").addEventListener("click",()=>{unlocked=Math.max(unlocked,levelIndex+2);startLevel(Math.min(levelIndex+1,LEVELS.length-1))});$("retryBtn").addEventListener("click",()=>startLevel(levelIndex));$("resultMapBtn").addEventListener("click",showHome);

// Pista automática cuando el jugador se queda mirando el tablero.
let hintTimer=null;
function findHint(){for(let y=0;y<size;y++)for(let x=0;x<size;x++){if(blocked(x,y)||!grid[y][x])continue;for(const [dx,dy] of [[1,0],[0,1]]){const nx=x+dx,ny=y+dy;if(nx>=size||ny>=size||blocked(nx,ny)||!grid[ny][nx])continue;[grid[y][x],grid[ny][nx]]=[grid[ny][nx],grid[y][x]];const ok=findMatches().length>0;[grid[y][x],grid[ny][nx]]=[grid[ny][nx],grid[y][x]];if(ok)return[[x,y],[nx,ny]]}}return null}
function scheduleHint(){clearTimeout(hintTimer);hintTimer=setTimeout(()=>{if(busy||$("game").classList.contains("hidden"))return;const h=findHint();if(!h)return;const b=$("board");h.forEach(([x,y])=>b.children[y*size+x]?.classList.add("hint-glow"))},8000)}
const _renderBase=render;render=function(){_renderBase();scheduleHint()};
let bestStars={};try{bestStars=JSON.parse(localStorage.getItem("magdalenaStars")||"{}")}catch(e){}
function starsFor(){const t=LEVELS[levelIndex].moves,r=moves/t;return r>=.45?3:r>=.25?2:1}
$("adPhoto").src=AD_DATA;
function applyLang(){
 document.documentElement.lang=lang;
 document.title="Magdalena Match-3 — Miami";
 document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n)});
 document.querySelectorAll("[data-i18n-html]").forEach(el=>{el.innerHTML=t(el.dataset.i18nHtml)});
 document.querySelectorAll("[data-i18n-alt]").forEach(el=>{el.alt=t(el.dataset.i18nAlt)});
 document.querySelectorAll("[data-i18n-title]").forEach(el=>{el.title=t(el.dataset.i18nTitle)});
 document.querySelectorAll("[data-i18n-aria]").forEach(el=>{el.setAttribute("aria-label",t(el.dataset.i18nAria))});
 $("langToggle").textContent=lang==="en"?"🌐 EN":"🌐 ES";
 $("soundToggle").textContent=soundEnabled?t("sound"):t("silence");
 $("soundToggle").setAttribute("aria-pressed",String(soundEnabled));
 $("musicToggle").textContent=musicEnabled?t("musicOn"):t("musicOff");
 $("musicToggle").setAttribute("aria-pressed",String(musicEnabled));
 renderCollectibles();
 if($("game").classList.contains("hidden"))renderLevels();else render();
}
$("langToggle").addEventListener("click",()=>{lang=lang==="es"?"en":"es";try{localStorage.setItem("magdalenaLang",lang)}catch(e){}applyLang()});
applyLang();
</script>
